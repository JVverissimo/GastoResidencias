services:
  # 1. Aplicação Backend (.NET 8 API)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasto-residencias-api
    ports:
      - "5076:5076"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5076
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-}
    networks:
      - observability-net
    restart: unless-stopped

  # 2. Servidor de Monitoramento e Coleta de Métricas (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: gasto-residencias-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability-net
    restart: unless-stopped

  # 3. Plataforma de Visualização e Dashboards (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: gasto-residencias-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - observability-net
    restart: unless-stopped

networks:
  observability-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
